<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Yuichi Okuhama — product designer. Design that makes complex things feel inevitable. An interactive terminal portfolio." />
    <meta name="theme-color" content="#060907" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23060907'/%3E%3Crect x='8' y='8' width='10' height='16' fill='%236bffa8'/%3E%3Ccircle cx='24' cy='21' r='4' fill='%2364f0ff'/%3E%3C/svg%3E" />
    <title>Yuichi Okuhama — Product Designer</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#stage">Skip to content</a>

    <!-- WebGL liquid/ASCII field -->
    <canvas id="gl" aria-hidden="true"></canvas>
    <div id="fallback-bg" aria-hidden="true" hidden></div>

    <div id="app">
      <!-- top status bar -->
      <header id="statusbar">
        <span class="status-left"><span class="dot" aria-hidden="true"></span>yuichi@portfolio</span>
        <nav id="chipnav" aria-label="Sections"></nav>
        <span class="status-right">
          <button id="motion-toggle" class="chip" type="button" aria-pressed="true">motion: on</button>
          <span id="clock" aria-hidden="true"></span>
        </span>
      </header>

      <!-- panels -->
      <main id="stage" tabindex="-1">
        <section id="hero" class="panel is-open" aria-label="Intro">
          <pre id="boot" aria-hidden="true"></pre>
          <h1 id="name"></h1>
          <p id="tagline"></p>
          <p id="intro"></p>
        </section>
        <section id="work" class="panel" aria-labelledby="work-h" hidden></section>
        <section id="study" class="panel" aria-label="Case study" hidden></section>
        <section id="process" class="panel" aria-labelledby="process-h" hidden></section>
        <section id="about" class="panel" aria-labelledby="about-h" hidden></section>
        <section id="events" class="panel" aria-labelledby="events-h" hidden></section>
        <section id="contact" class="panel" aria-labelledby="contact-h" hidden></section>
      </main>

      <!-- command line -->
      <footer id="cli">
        <div id="cli-log" role="log" aria-live="polite"></div>
        <div id="cli-row">
          <label for="cli-input" id="cli-prompt">→ ~ $</label>
          <input id="cli-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
                 placeholder="type `help` or click above" aria-label="Command input" />
        </div>
      </footer>
    </div>
  </body>
</html>
