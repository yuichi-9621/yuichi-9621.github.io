<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Yuichi Okuhama designs software and then builds it. San Francisco, from Okinawa." />
    <meta name="theme-color" content="#e6a94f" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='12' y='4' width='40' height='56' rx='5' fill='%231e4553'/%3E%3Crect x='24' y='9' width='16' height='3' rx='1.5' fill='%23dfddd2'/%3E%3C/svg%3E" />
    <title>Yuichi Okuhama · Design Engineer</title>
    <script type="module" src="/src/main.js"></script>
    <!-- GoatCounter: cookie-less, no-PII visit counts. Owner-only dashboard at
         yuichiokuhama.goatcounter.com. no_onload: views are counted as virtual
         pageviews via src/track.js so sheet navigation is visible.
         count.js ignores localhost, so dev sessions don't pollute the stats. -->
    <script
      data-goatcounter="https://yuichiokuhama.goatcounter.com/count"
      data-goatcounter-settings='{"no_onload": true}'
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </head>
  <body>
    <!-- The badge's menu as real buttons, first in the DOM (DESIGN.md §10).
         With WebGL it's visually hidden but focusable. Without it, it is the card. -->
    <main id="card">
      <h1 class="visually-hidden">Yuichi Okuhama, design engineer</h1>
      <nav id="menu" aria-label="Badge">
        <p class="role">Design Engineer</p>
        <button type="button" data-page="about" class="name" aria-label="About">Yuichi<br />Okuhama<span class="dest">about</span></button>
        <button type="button" data-page="work" aria-label="Work">Work<span class="dest">work</span></button>
        <button type="button" data-page="contact" aria-label="Contact">Say hello<span class="dest">contact</span></button>
        <p class="place">San Francisco</p>
      </nav>
    </main>

    <canvas id="badge" aria-hidden="true"></canvas>

    <dialog id="sheet" aria-labelledby="sheet-title">
      <button type="button" class="close" data-close>Close</button>
      <div class="sheet-body"></div>
    </dialog>
  </body>
</html>
